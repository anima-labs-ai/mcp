name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml: `bun-version: latest` resolves the tag
          # through api.github.com, so an API 503 fast-fails the job before it
          # runs.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Trusted Publishing (OIDC) — no NPM_TOKEN. npm >= 11.5.1 exchanges the
      # workflow's id-token for a short-lived credential and attaches provenance
      # automatically (so no --provenance flag / NODE_AUTH_TOKEN). Requires an
      # npm trusted publisher configured for @anima-labs/mcp:
      # GitHub Actions -> anima-labs-ai/mcp -> release.yml.
      - name: Publish to npm (trusted publishing)
        run: |
          npm install -g npm@latest
          npm publish --access public
