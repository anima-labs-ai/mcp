# Smithery Registry Manifest
# https://smithery.ai/docs/manifest
#
# Tool names/groups below are the REAL registered tools of this package
# (extracted from registerTool calls in src/tools/**). Keep them in sync —
# a previous version of this manifest advertised a ~3x inflated count with
# invented names and whole invented groups (x402, wallet, pods, registry,
# "USPS validation"); competitive-parity spec E4 removed all of it.
# src/__tests__/unit/smithery-manifest.test.ts enforces the sync.

name: "@anima-labs/mcp"
display_name: "Anima — AI Agent Identity Platform"
description: >
  Give your AI agents real-world capabilities: email inboxes, phone
  numbers, SMS, voice calls, custom domains, webhooks, and an encrypted
  credential vault. 54 tools for autonomous agent operations. Prefer the
  hosted server at https://mcp.useanima.sh/mcp for zero-install use; this
  package is the stdio bridge for local/offline-config clients.
version: "0.5.4"
license: "MIT"

author:
  name: "Anima Labs"
  url: "https://useanima.sh"
  email: "support@useanima.sh"

repository: "https://github.com/anima-labs-ai/mcp"
homepage: "https://useanima.sh"
documentation: "https://docs.useanima.sh/mcp-servers"

icon: "https://useanima.sh/icon.png"

categories:
  - "AI Agent Tools"
  - "Email"
  - "Identity"
  - "Communication"

tags:
  - ai-agent
  - email-api
  - voice
  - credential-vault
  - phone-sms
  - agent-identity
  - mcp-server

install:
  command: "npx"
  args: ["-y", "@anima-labs/mcp"]
  env:
    ANIMA_API_KEY:
      description: "Your Anima agent API key (ak_...)"
      required: true
    ANIMA_MASTER_KEY:
      description: "Org master key (mk_...) — unlocks admin tools (agent_delete, domain management)"
      required: false
    ANIMA_API_URL:
      description: "API base URL override (defaults to https://api.useanima.sh)"
      required: false

transports:
  - type: "stdio"
    description: "Default transport for Claude Desktop, Cursor, and similar tools"
  - type: "http"
    description: "HTTP transport for web-based MCP clients"
    args: ["--http", "--port=8014"]

tool_groups:
  - name: "workspace"
    description: "Account overview and usage rollups"
    tools: ["account_overview", "usage_overview"]
  - name: "agent"
    description: "Create and manage AI agent identities"
    tools: ["agent_create", "agent_get", "agent_list", "agent_update", "agent_delete"]
  - name: "email"
    description: "Send, receive, reply, forward; drafts, threads, attachments"
    tools: ["email_send", "email_get", "email_list", "email_search", "email_reply", "email_forward", "email_thread_get", "email_attachment_get", "email_draft_create", "email_draft_get", "email_draft_list", "email_draft_send", "email_draft_delete"]
  - name: "domain"
    description: "Custom email domain management: DNS records, verification, zone files"
    tools: ["domain_create", "domain_get", "domain_list", "domain_update", "domain_delete", "domain_verify", "domain_zone_file"]
  - name: "phone"
    description: "Phone number provisioning and release"
    tools: ["phone_number_provision", "phone_number_list", "phone_number_release"]
  - name: "phone_call"
    description: "Outbound voice calls, transcripts, recordings, voice catalog"
    tools: ["phone_call_create", "phone_call_get", "phone_call_list", "phone_call_transcript_get", "phone_call_recording_get", "voice_list"]
  - name: "sms"
    description: "SMS send and conversation threads"
    tools: ["sms_send", "sms_get", "sms_list", "sms_thread_get", "sms_thread_list"]
  - name: "vault"
    description: "Encrypted credential vault: CRUD, search, TOTP"
    tools: ["vault_provision", "vault_credential_create", "vault_credential_get", "vault_credential_list", "vault_credential_update", "vault_credential_delete", "vault_credential_search", "vault_credential_get_totp"]
  - name: "webhook"
    description: "Webhook subscription management and testing"
    tools: ["webhook_set", "webhook_get", "webhook_list", "webhook_delete", "webhook_test"]

features:
  selective_loading: true
  selective_loading_flag: "--tools"
  selective_loading_example: "--tools=email,vault,phone"
